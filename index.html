<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyUser.dev - Anime Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #111827;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logo { font-size: 1.5rem; font-weight: bold; color: #38bdf8; text-decoration: none; cursor: pointer; }

        .search-bar {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 6px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        .hero {
            background: linear-gradient(180deg, #111827 0%, #0b0f19 100%);
            padding: 50px 30px;
            text-align: center;
            border-bottom: 1px solid #1f2937;
        }

        .hero h1 { font-size: 2.5rem; color: #f8fafc; margin-bottom: 10px; }
        .hero p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 30px; }

        .cta-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .cta-btn:hover { background: #0284c7; color: #fff; transform: translateY(-2px); }

        .top5-container { max-width: 1200px; margin: 0 auto; padding: 40px 30px; width: 100%; }
        .section-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 20px; color: #e2e8f0; }

        .top5-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .top-card {
            position: relative;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .top-card:hover { transform: translateY(-5px); }
        .top-card img { width: 100%; height: 260px; object-fit: cover; }

        .rank-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 900;
            font-size: 1rem;
            padding: 4px 10px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .top-card-info { padding: 12px; }
        .top-card-title { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            flex-wrap: wrap;
            gap: 15px;
            background: #0f172a;
        }

        .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
        .tab {
            padding: 8px 16px;
            background: #1e293b;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            user-select: none;
            color: #94a3b8;
        }
        .tab.active { background: #38bdf8; color: #0f172a; font-weight: bold; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            padding: 30px;
            flex-grow: 1;
        }

        .card {
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 230px; object-fit: cover; }
        .card-info { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 0.9rem; font-weight: 600; line-height: 1.2; margin-bottom: 6px; }
        .card-sub { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }

        .status-msg { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: #94a3b8; }

        /* Modal Player */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal.open { display: flex; }
        .modal-content { background: #1e293b; width: 100%; max-width: 900px; border-radius: 12px; overflow: hidden; }
        .video-container { position: relative; padding-top: 56.25%; background: #000; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .modal-body { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .ep-controls { display: flex; gap: 10px; align-items: center; }
        .ep-controls input { width: 70px; padding: 6px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #fff; }
        .close-btn { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <a class="logo" id="homeLogo">ProxyUser.dev</a>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search any anime title...">
        </div>
    </header>

    <div id="frontSection">
        <section class="hero">
            <h1>Welcome to ProxyUser.dev</h1>
            <p>Stream top trending anime TV shows, movies, and specials instantly.</p>
            <button class="cta-btn" id="exploreBtn">Explore All Anime</button>
        </section>

        <div class="top5-container">
            <div class="section-title">🔥 Top 5 Anime Right Now</div>
            <div class="top5-grid" id="top5Grid">
                <div class="status-msg">Loading top picks...</div>
            </div>
        </div>
    </div>

    <div id="catalogSection">
        <div class="controls">
            <div class="tabs">
                <div class="tab active" data-type="">All Popular</div>
                <div class="tab" data-type="tv">TV Series</div>
                <div class="tab" data-type="movie">Movies</div>
                <div class="tab" data-type="ova">OVAs</div>
                <div class="tab" data-type="special">Specials</div>
            </div>
        </div>

        <div class="grid" id="animeGrid"></div>
        <div id="loadingStatus" class="status-msg" style="display:none;"></div>
    </div>

    <div class="modal" id="playerModal">
        <div class="modal-content">
            <div class="video-container" id="videoWrapper"></div>
            <div class="modal-body">
                <div class="ep-controls">
                    <label>Episode:</label>
                    <input type="number" id="epNumber" value="1" min="1">
                    <select id="trackType" style="padding: 6px; border-radius: 4px; background: #0f172a; color: #fff; border: 1px solid #334155;">
                        <option value="sub">Sub</option>
                        <option value="dub">Dub</option>
                    </select>
                </div>
                <button class="close-btn" id="closeModal">Close Player</button>
            </div>
        </div>
    </div>

    <script>
        let allAnime = [];
        let currentType = '';
        let searchQuery = '';
        let currentAnimeId = null;

        const catalogSection = document.getElementById('catalogSection');
        const top5Grid = document.getElementById('top5Grid');
        const grid = document.getElementById('animeGrid');
        const searchInput = document.getElementById('searchInput');
        const tabs = document.querySelectorAll('.tab');
        const modal = document.getElementById('playerModal');
        const videoWrapper = document.getElementById('videoWrapper');
        const epInput = document.getElementById('epNumber');
        const trackSelect = document.getElementById('trackType');

        async function loadCatalog() {
            try {
                const res = await fetch('./anime.json');
                const rawList = await res.json();

                allAnime = rawList.map(item => ({
                    id: item.id,
                    title: item.title,
                    type: item.type || 'TV',
                    image: item.image
                }));

                renderTop5(allAnime.slice(0, 5));
                applyFilters();
            } catch (err) {
                grid.innerHTML = '<div class="status-msg">Failed to load catalog.</div>';
            }
        }

        function renderTop5(list) {
            top5Grid.innerHTML = list.map((item, index) => `
                <div class="top-card" onclick="openPlayer(${item.id})">
                    <div class="rank-badge">#${index + 1}</div>
                    <img src="${item.image || ''}" alt="${item.title}" loading="lazy" onerror="this.onerror=null; this.style.opacity='0.3';">
                    <div class="top-card-info">
                        <div class="top-card-title">${item.title}</div>
                    </div>
                </div>
            `).join('');
        }

        function renderCards(list) {
            if (list.length === 0) {
                grid.innerHTML = '<div class="status-msg">No titles found.</div>';
                return;
            }

            grid.innerHTML = list.map(item => `
                <div class="card" onclick="openPlayer(${item.id})">
                    <img src="${item.image || ''}" alt="${item.title}" loading="lazy" onerror="this.onerror=null; this.style.opacity='0.3';">
                    <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-sub">${item.type}</div>
                    </div>
                </div>
            `).join('');
        }

        function applyFilters() {
            const filtered = allAnime.filter(item => {
                const matchesType = !currentType || item.type.toLowerCase() === currentType.toLowerCase();
                const matchesSearch = !searchQuery || item.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesType && matchesSearch;
            });

            renderCards(filtered);
        }

        function openPlayer(id) {
            currentAnimeId = id;
            updateEmbed();
            modal.classList.add('open');
        }

        function updateEmbed() {
            const ep = epInput.value || 1;
            const track = trackSelect.value || 'sub';
            videoWrapper.innerHTML = `
                <iframe src="https://zokoanime.video/stream/mal/${currentAnimeId}/${ep}/${track}?color=38bdf8" allowfullscreen></iframe>
            `;
        }

        document.getElementById('exploreBtn').addEventListener('click', () => {
            catalogSection.scrollIntoView({ behavior: 'smooth' });
        });

        document.getElementById('homeLogo').addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            if (searchQuery.length > 0) catalogSection.scrollIntoView({ behavior: 'smooth' });
            applyFilters();
        });

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentType = tab.dataset.type;
                applyFilters();
            });
        });

        epInput.addEventListener('change', updateEmbed);
        trackSelect.addEventListener('change', updateEmbed);
        document.getElementById('closeModal').addEventListener('click', () => {
            modal.classList.remove('open');
            videoWrapper.innerHTML = '';
        });

        loadCatalog();
    </script>
</body>
</html>
