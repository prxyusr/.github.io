<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyUser - Anime & Movies Catalog</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            500: '#14b8a6',
                            600: '#0d9488',
                            900: '#134e4a',
                        },
                        darkbg: '#0f172a',
                        darkcard: '#1e293b',
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-100 font-sans min-h-screen flex flex-col antialiased">

    <!-- Header / Navigation -->
    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <!-- Logo -->
            <a href="#" onclick="loadCategory('top', 'all')" class="flex items-center space-x-2 text-xl font-bold tracking-tight text-teal-400 hover:text-teal-300 transition">
                <i class="fa-solid fa-play-circle text-2xl"></i>
                <span>ProxyUser<span class="text-slate-400 font-normal text-sm ml-1">.dev</span></span>
            </a>

            <!-- Search Bar -->
            <div class="flex-1 max-w-md relative">
                <div class="relative">
                    <input type="text" id="search-input" placeholder="Search anime, movies, OVAs..." 
                           class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-xl pl-10 pr-10 py-2 focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </div>
                    <button id="clear-search" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-200">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- Header Actions -->
            <div class="flex items-center space-x-3">
                <button onclick="openTesterModal()" class="px-3 py-1.5 text-xs sm:text-sm font-medium bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-slate-300 hover:text-white transition flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-teal-400"></i>
                    <span class="hidden sm:inline">Custom Streamer</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">

        <!-- Controls Toolbar -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900/50 p-4 rounded-2xl border border-slate-800">
            <!-- Tabs -->
            <div class="flex items-center space-x-1 overflow-x-auto pb-2 md:pb-0 scrollbar-none" id="type-tabs">
                <button onclick="setFilter('type', 'all')" data-tab="all" class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap bg-teal-500 text-slate-950 font-bold">All</button>
                <button onclick="setFilter('type', 'tv')" data-tab="tv" class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap text-slate-400 hover:text-slate-200 hover:bg-slate-800">TV Series</button>
                <button onclick="setFilter('type', 'movie')" data-tab="movie" class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap text-slate-400 hover:text-slate-200 hover:bg-slate-800">Movies</button>
                <button onclick="setFilter('type', 'ova')" data-tab="ova" class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap text-slate-400 hover:text-slate-200 hover:bg-slate-800">OVAs</button>
                <button onclick="setFilter('type', 'special')" data-tab="special" class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap text-slate-400 hover:text-slate-200 hover:bg-slate-800">Specials</button>
            </div>

            <!-- Quick Category / Genre Selectors -->
            <div class="flex items-center gap-3">
                <select id="category-select" onchange="handleCategoryChange(this.value)" class="bg-slate-800 text-slate-300 text-xs sm:text-sm border border-slate-700 rounded-lg px-3 py-1.5 focus:outline-none focus:border-teal-500">
                    <option value="bypopularity">Top Popular</option>
                    <option value="airing">Top Airing</option>
                    <option value="favorite">Most Favorited</option>
                    <option value="upcoming">Upcoming</option>
                </select>

                <select id="genre-select" onchange="handleGenreChange(this.value)" class="bg-slate-800 text-slate-300 text-xs sm:text-sm border border-slate-700 rounded-lg px-3 py-1.5 focus:outline-none focus:border-teal-500">
                    <option value="">All Genres</option>
                    <option value="1">Action</option>
                    <option value="2">Adventure</option>
                    <option value="4">Comedy</option>
                    <option value="8">Drama</option>
                    <option value="10">Fantasy</option>
                    <option value="14">Horror</option>
                    <option value="22">Romance</option>
                    <option value="24">Sci-Fi</option>
                    <option value="36">Slice of Life</option>
                    <option value="30">Sports</option>
                    <option value="37">Supernatural</option>
                </select>
            </div>
        </div>

        <!-- Section Title -->
        <div class="flex items-center justify-between">
            <h2 id="section-title" class="text-xl font-bold text-slate-100 flex items-center gap-2">
                <span class="w-2 h-6 bg-teal-500 rounded-full inline-block"></span>
                <span>Top Popular Anime & Movies</span>
            </h2>
            <span id="result-count" class="text-xs text-slate-400"></span>
        </div>

        <!-- Grid Container -->
        <div id="catalog-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 sm:gap-6">
            <!-- Dynamic cards injected via JS -->
        </div>

        <!-- Pagination Controls -->
        <div class="flex justify-center items-center gap-4 py-8" id="pagination-container">
            <button id="prev-page" onclick="changePage(-1)" class="px-4 py-2 bg-slate-800 border border-slate-700 text-slate-300 hover:text-white rounded-lg disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center gap-2">
                <i class="fa-solid fa-chevron-left text-xs"></i> Previous
            </button>
            <span id="page-indicator" class="text-sm text-slate-400 font-medium">Page 1</span>
            <button id="next-page" onclick="changePage(1)" class="px-4 py-2 bg-slate-800 border border-slate-700 text-slate-300 hover:text-white rounded-lg disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center gap-2">
                Next <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 space-y-2">
            <p>Hosted on <span class="text-teal-400 font-semibold">proxyuser.dev</span> • Video streams hosted via Zokoanime.video embed API.</p>
            <p>Data provided by Jikan API (MyAnimeList open REST API).</p>
        </div>
    </footer>

    <!-- Video Player Modal -->
    <div id="player-modal" class="fixed inset-0 z-50 hidden bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-2 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-5xl overflow-hidden shadow-2xl flex flex-col max-h-[95vh]">
            
            <!-- Modal Header -->
            <div class="p-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between gap-4">
                <div class="flex items-center space-x-3 overflow-hidden">
                    <span id="modal-type-badge" class="px-2 py-0.5 text-[10px] uppercase font-bold bg-teal-500/20 text-teal-300 border border-teal-500/30 rounded">TV</span>
                    <h3 id="modal-anime-title" class="text-base sm:text-lg font-bold text-slate-100 truncate">Loading Title...</h3>
                </div>
                <button onclick="closePlayerModal()" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Video Player Wrapper (16:9 Aspect Ratio) -->
            <div class="relative w-full bg-black aspect-video">
                <div id="modal-player-container" class="w-full h-full">
                    <!-- Iframe injected here -->
                </div>
            </div>

            <!-- Player Controls Toolbar -->
            <div class="p-4 bg-slate-900 border-t border-slate-800 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 overflow-y-auto">
                
                <!-- Episode Selector -->
                <div class="flex items-center space-x-2">
                    <label for="modal-episode-select" class="text-xs text-slate-400 font-medium whitespace-nowrap">Episode:</label>
                    <select id="modal-episode-select" onchange="updatePlayerStream()" class="bg-slate-800 text-slate-200 text-sm border border-slate-700 rounded-lg px-3 py-1.5 focus:outline-none focus:border-teal-500">
                        <!-- Episode options injected dynamically -->
                    </select>
                </div>

                <!-- Audio Track Selector -->
                <div class="flex items-center space-x-2">
                    <span class="text-xs text-slate-400 font-medium">Audio:</span>
                    <div class="inline-flex rounded-lg bg-slate-800 p-1 border border-slate-700" id="modal-track-selector">
                        <button onclick="setTrack('sub')" data-track="sub" class="track-btn px-3 py-1 text-xs rounded-md font-medium text-slate-300 hover:text-white bg-slate-700">SUB</button>
                        <button onclick="setTrack('dub')" data-track="dub" class="track-btn px-3 py-1 text-xs rounded-md font-medium text-slate-400 hover:text-white">DUB</button>
                        <button onclick="setTrack('hsub')" data-track="hsub" class="track-btn px-3 py-1 text-xs rounded-md font-medium text-slate-400 hover:text-white">HARD SUB</button>
                    </div>
                </div>

                <!-- Share Link Copy Button -->
                <button onclick="copyShareLink()" class="px-3 py-1.5 text-xs bg-teal-500/10 hover:bg-teal-500/20 text-teal-300 border border-teal-500/30 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-share-nodes"></i>
                    <span>Copy Share Link</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Manual Stream Tester Modal -->
    <div id="tester-modal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-terminal text-teal-400"></i> Direct Stream Tester
                </h3>
                <button onclick="closeTesterModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="tester-form" onsubmit="handleManualStream(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Provider ID Type</label>
                    <select id="manual-type" class="w-full bg-slate-800 text-slate-200 text-sm border border-slate-700 rounded-lg p-2.5">
                        <option value="mal">MyAnimeList (MAL ID)</option>
                        <option value="anilist">AniList ID</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Anime ID Number</label>
                    <input type="number" id="manual-id" placeholder="e.g. 21 for One Piece" required
                           class="w-full bg-slate-800 text-slate-200 text-sm border border-slate-700 rounded-lg p-2.5 focus:outline-none focus:border-teal-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Episode</label>
                        <input type="number" id="manual-ep" value="1" min="1" required
                               class="w-full bg-slate-800 text-slate-200 text-sm border border-slate-700 rounded-lg p-2.5">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Audio Track</label>
                        <select id="manual-track" class="w-full bg-slate-800 text-slate-200 text-sm border border-slate-700 rounded-lg p-2.5">
                            <option value="sub">Sub</option>
                            <option value="dub">Dub</option>
                            <option value="hsub">HardSub</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full py-2.5 mt-2 bg-teal-500 hover:bg-teal-600 text-slate-950 font-bold text-sm rounded-lg transition">
                    Launch Player
                </button>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 hidden bg-teal-500 text-slate-950 font-semibold px-4 py-2.5 rounded-xl shadow-lg flex items-center space-x-2 text-sm">
        <i class="fa-solid fa-check-circle"></i>
        <span id="toast-message">Copied!</span>
    </div>

    <!-- Application Script -->
    <script>
        // State Management
        let currentState = {
            query: '',
            filterType: 'all', // all, tv, movie, ova, special
            filterCategory: 'bypopularity', // bypopularity, airing, favorite, upcoming
            genre: '',
            page: 1,
            hasNextPage: false
        };

        let currentActiveItem = {
            mal_id: null,
            title: '',
            episodes: 1,
            type: 'MAL',
            currentEp: 1,
            track: 'sub'
        };

        // DOM Elements
        const catalogGrid = document.getElementById('catalog-grid');
        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search');
        const sectionTitle = document.getElementById('section-title');
        const pageIndicator = document.getElementById('page-indicator');
        const prevPageBtn = document.getElementById('prev-page');
        const nextPageBtn = document.getElementById('next-page');

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            fetchCatalog();
            setupSearch();
            checkUrlParameters();
        });

        // Parse query params (e.g. proxyuser.dev/?watch=21&ep=1)
        function checkUrlParameters() {
            const params = new URLSearchParams(window.location.search);
            const watchId = params.get('watch') || params.get('id');
            if (watchId) {
                const ep = params.get('ep') || 1;
                const track = params.get('track') || 'sub';
                const type = params.get('type') || 'mal';
                
                openPlayerModalDirect(watchId, `Anime Stream (${watchId})`, 24, ep, track, type);
            }
        }

        // Fetch Data from Jikan API v4
        async function fetchCatalog() {
            showLoadingGrid();

            try {
                let apiUrl = '';
                
                if (currentState.query) {
                    // Search API
                    apiUrl = `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(currentState.query)}&page=${currentState.page}&sfw=true`;
                    if (currentState.filterType !== 'all') {
                        apiUrl += `&type=${currentState.filterType}`;
                    }
                    if (currentState.genre) {
                        apiUrl += `&genres=${currentState.genre}`;
                    }
                } else if (currentState.genre) {
                    // Genre API
                    apiUrl = `https://api.jikan.moe/v4/anime?genres=${currentState.genre}&page=${currentState.page}&order_by=score&sort=desc&sfw=true`;
                    if (currentState.filterType !== 'all') {
                        apiUrl += `&type=${currentState.filterType}`;
                    }
                } else {
                    // Top / Popular API
                    apiUrl = `https://api.jikan.moe/v4/top/anime?page=${currentState.page}&sfw=true`;
                    if (currentState.filterCategory) {
                        apiUrl += `&filter=${currentState.filterCategory}`;
                    }
                    if (currentState.filterType !== 'all') {
                        apiUrl += `&type=${currentState.filterType}`;
                    }
                }

                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.data) {
                    renderCards(data.data);
                    currentState.hasNextPage = data.pagination?.has_next_page || false;
                    updatePaginationUI();
                } else {
                    renderEmptyState("No results found.");
                }
            } catch (error) {
                console.error("API Error:", error);
                renderEmptyState("Failed to connect to API. Please try again.");
            }
        }

        // Render Anime Cards
        function renderCards(items) {
            catalogGrid.innerHTML = '';

            if (items.length === 0) {
                renderEmptyState("No titles match your selected filters.");
                return;
            }

            items.forEach(anime => {
                const title = anime.title_english || anime.title;
                const poster = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url;
                const score = anime.score ? anime.score.toFixed(1) : 'N/A';
                const episodes = anime.episodes || '?';
                const type = anime.type || 'TV';
                const malId = anime.mal_id;

                const card = document.createElement('div');
                card.className = "group relative bg-slate-800/80 rounded-xl overflow-hidden border border-slate-700/50 hover:border-teal-500/50 transition-all duration-300 flex flex-col shadow-lg";

                card.innerHTML = `
                    <div class="relative aspect-[3/4] overflow-hidden bg-slate-900">
                        <img src="${poster}" alt="${title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        
                        <!-- Overlay Badge -->
                        <div class="absolute top-2 left-2 flex flex-col gap-1">
                            <span class="px-2 py-0.5 text-[10px] font-extrabold tracking-wider bg-slate-950/80 backdrop-blur-sm text-teal-400 border border-teal-500/30 rounded uppercase">${type}</span>
                        </div>

                        <div class="absolute top-2 right-2 bg-slate-950/80 backdrop-blur-sm text-amber-400 text-xs font-bold px-2 py-0.5 rounded-md flex items-center gap-1 border border-amber-500/30">
                            <i class="fa-solid fa-star text-[10px]"></i> ${score}
                        </div>

                        <!-- Hover Action Button -->
                        <div class="absolute inset-0 bg-slate-950/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center p-4">
                            <button onclick="openPlayerModalDirect(${malId}, \`${escapeQuotes(title)}\`, ${episodes === '?' ? 24 : episodes}, 1, 'sub', 'mal')" 
                                    class="w-full py-2.5 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold text-xs rounded-lg shadow-lg flex items-center justify-center space-x-2 transform translate-y-2 group-hover:translate-y-0 transition-transform">
                                <i class="fa-solid fa-play"></i>
                                <span>Watch Stream</span>
                            </button>
                        </div>
                    </div>

                    <div class="p-3 flex-1 flex flex-col justify-between">
                        <h3 class="text-xs sm:text-sm font-semibold text-slate-200 line-clamp-2 hover:text-teal-300 transition" title="${title}">${title}</h3>
                        <div class="mt-2 text-[11px] text-slate-400 flex items-center justify-between border-t border-slate-700/50 pt-2">
                            <span>${episodes} Ep${episodes > 1 || episodes === '?' ? 's' : ''}</span>
                            <span class="text-teal-400 font-medium">Zoko Stream</span>
                        </div>
                    </div>
                `;

                catalogGrid.appendChild(card);
            });
        }

        // Setup Search Handling with Debounce
        function setupSearch() {
            let debounceTimer;

            searchInput.addEventListener('input', (e) => {
                const val = e.target.value.trim();
                
                if (val.length > 0) {
                    clearSearchBtn.classList.remove('hidden');
                } else {
                    clearSearchBtn.classList.add('hidden');
                }

                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    currentState.query = val;
                    currentState.page = 1;
                    
                    if (val) {
                        sectionTitle.querySelector('span:last-child').textContent = `Search Results for "${val}"`;
                    } else {
                        sectionTitle.querySelector('span:last-child').textContent = `Top Popular Anime & Movies`;
                    }

                    fetchCatalog();
                }, 500);
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearSearchBtn.classList.add('hidden');
                currentState.query = '';
                currentState.page = 1;
                sectionTitle.querySelector('span:last-child').textContent = `Top Popular Anime & Movies`;
                fetchCatalog();
            });
        }

        // Filters
        function setFilter(key, value) {
            currentState[key] = value;
            currentState.page = 1;

            if (key === 'type') {
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    if (btn.dataset.tab === value) {
                        btn.className = "tab-btn px-4 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap bg-teal-500 text-slate-950 font-bold";
                    } else {
                        btn.className = "tab-btn px-4 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap text-slate-400 hover:text-slate-200 hover:bg-slate-800";
                    }
                });
            }

            fetchCatalog();
        }

        function handleCategoryChange(val) {
            currentState.filterCategory = val;
            currentState.genre = '';
            document.getElementById('genre-select').value = '';
            currentState.page = 1;
            fetchCatalog();
        }

        function handleGenreChange(val) {
            currentState.genre = val;
            currentState.page = 1;
            fetchCatalog();
        }

        // Pagination
        function changePage(delta) {
            currentState.page += delta;
            if (currentState.page < 1) currentState.page = 1;
            fetchCatalog();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updatePaginationUI() {
            pageIndicator.textContent = `Page ${currentState.page}`;
            prevPageBtn.disabled = currentState.page === 1;
            nextPageBtn.disabled = !currentState.hasNextPage;
        }

        // Open Video Player Modal
        function openPlayerModalDirect(malId, title, episodeCount, currentEp = 1, track = 'sub', type = 'mal') {
            currentActiveItem = {
                mal_id: malId,
                title: title,
                episodes: episodeCount || 24,
                type: type,
                currentEp: parseInt(currentEp),
                track: track
            };

            document.getElementById('modal-anime-title').textContent = title;
            document.getElementById('modal-type-badge').textContent = type.toUpperCase();

            // Populate episode dropdown
            const epSelect = document.getElementById('modal-episode-select');
            epSelect.innerHTML = '';
            
            const totalEps = (typeof episodeCount === 'number' && episodeCount > 0) ? episodeCount : 24;
            for (let i = 1; i <= totalEps; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `Episode ${i}`;
                if (i === parseInt(currentEp)) opt.selected = true;
                epSelect.appendChild(opt);
            }

            // Update Track Selector Buttons UI
            setTrackUI(track);

            // Load iframe
            updatePlayerStream();

            document.getElementById('player-modal').classList.remove('hidden');
        }

        function closePlayerModal() {
            document.getElementById('player-modal').classList.add('hidden');
            document.getElementById('modal-player-container').innerHTML = ''; // Stop video playback
        }

        function updatePlayerStream() {
            const epSelect = document.getElementById('modal-episode-select');
            currentActiveItem.currentEp = epSelect.value || 1;

            const container = document.getElementById('modal-player-container');
            
            // Construct Zokoanime Embed URL
            const embedUrl = `https://zokoanime.video/stream/${currentActiveItem.type}/${currentActiveItem.mal_id}/${currentActiveItem.currentEp}/${currentActiveItem.track}`;

            container.innerHTML = `
                <iframe src="${embedUrl}" 
                        class="w-full h-full border-0" 
                        allowfullscreen="true" 
                        allow="autoplay; encrypted-media; picture-in-picture">
                </iframe>
            `;
        }

        function setTrack(track) {
            currentActiveItem.track = track;
            setTrackUI(track);
            updatePlayerStream();
        }

        function setTrackUI(track) {
            document.querySelectorAll('#modal-track-selector button').forEach(btn => {
                if (btn.dataset.track === track) {
                    btn.className = "track-btn px-3 py-1 text-xs rounded-md font-medium text-slate-100 bg-teal-600 font-bold";
                } else {
                    btn.className = "track-btn px-3 py-1 text-xs rounded-md font-medium text-slate-400 hover:text-white";
                }
            });
        }

        // Shareable Link Generator
        function copyShareLink() {
            const shareUrl = `https://proxyuser.dev/?watch=${currentActiveItem.mal_id}&ep=${currentActiveItem.currentEp}&track=${currentActiveItem.track}&type=${currentActiveItem.type}`;
            
            // execCommand fallback for strict browser sandboxes
            const dummy = document.createElement('textarea');
            document.body.appendChild(dummy);
            dummy.value = shareUrl;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);

            showToast("Share link copied to clipboard!");
        }

        // Manual Tester Modal
        function openTesterModal() {
            document.getElementById('tester-modal').classList.remove('hidden');
        }

        function closeTesterModal() {
            document.getElementById('tester-modal').classList.add('hidden');
        }

        function handleManualStream(e) {
            e.preventDefault();
            const id = document.getElementById('manual-id').value;
            const ep = document.getElementById('manual-ep').value;
            const type = document.getElementById('manual-type').value;
            const track = document.getElementById('manual-track').value;

            closeTesterModal();
            openPlayerModalDirect(id, `Custom Stream (#${id})`, 50, ep, track, type);
        }

        // Helpers
        function showLoadingGrid() {
            catalogGrid.innerHTML = Array(12).fill(0).map(() => `
                <div class="bg-slate-800/40 rounded-xl aspect-[3/4] animate-pulse border border-slate-800"></div>
            `).join('');
        }

        function renderEmptyState(message) {
            catalogGrid.innerHTML = `
                <div class="col-span-full py-16 text-center text-slate-500 space-y-3">
                    <i class="fa-solid fa-film text-4xl text-slate-600"></i>
                    <p class="text-sm font-medium">${message}</p>
                </div>
            `;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        function escapeQuotes(str) {
            return str ? str.replace(/'/g, "\\'").replace(/"/g, '&quot;') : '';
        }
    </script>
</body>
</html>
