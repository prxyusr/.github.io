<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Hub & Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131c2e',
                        accent: '#6366f1'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen font-sans antialiased">

    <!-- Header Section -->
    <header class="max-w-7xl mx-auto px-6 py-8 flex flex-col md:flex-row justify-between items-center border-b border-gray-800">
        <h1 class="text-2xl font-bold tracking-wider text-accent">PRXY.HUB</h1>
        <nav class="flex gap-6 mt-4 md:mt-0 text-sm text-gray-400">
            <a href="#" class="hover:text-accent transition">Home</a>
            <a href="#catalog" class="hover:text-accent transition">Catalog</a>
            <a href="https://github.com/prxyusr" target="_blank" class="hover:text-accent transition">GitHub</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-12" id="catalog">
        
        <!-- Section Title & Media Category Switcher -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h2 class="text-3xl font-extrabold tracking-tight">Media Catalog</h2>
                <p class="text-sm text-gray-400 mt-1">Explore and stream anime, movies, and TV shows.</p>
            </div>
            
            <!-- Category Buttons -->
            <div class="flex bg-cardBg p-1.5 rounded-xl border border-gray-800">
                <button onclick="switchCategory('anime')" class="cat-btn px-5 py-2 rounded-lg text-sm font-medium transition bg-accent text-white" data-category="anime">Anime</button>
                <button onclick="switchCategory('movie')" class="cat-btn px-5 py-2 rounded-lg text-sm font-medium transition text-gray-400 hover:text-white" data-category="movie">Movies</button>
                <button onclick="switchCategory('tv')" class="cat-btn px-5 py-2 rounded-lg text-sm font-medium transition text-gray-400 hover:text-white" data-category="tv">TV Shows</button>
            </div>
        </div>

        <!-- Catalog Grid -->
        <div id="media-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
            <!-- Dynamically populated cards will appear here -->
        </div>
    </main>

    <!-- Player Modal -->
    <div id="player-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden z-50 flex flex-col items-center justify-center p-4 md:p-8">
        <div class="w-full max-w-5xl bg-cardBg rounded-2xl border border-gray-800 overflow-hidden shadow-2xl flex flex-col">
            
            <!-- Modal Header / Controls -->
            <div class="flex justify-between items-center px-6 py-4 border-b border-gray-800">
                <div class="flex items-center gap-4">
                    <span id="modal-title" class="font-semibold text-lg text-white">Now Playing</span>
                    
                    <!-- Server Switcher Dropdown -->
                    <select id="server-select" onchange="changeServer(this.value)" class="bg-darkBg border border-gray-700 text-xs text-gray-300 rounded-lg px-3 py-1.5 focus:outline-none focus:border-accent">
                        <option value="cinesrc" selected>CineSrc (Primary)</option>
                        <option value="vidlink">VidLink (Backup)</option>
                    </select>
                </div>
                
                <button onclick="closePlayer()" class="text-gray-400 hover:text-white text-xl font-bold px-3 py-1 rounded-lg bg-gray-800/50 hover:bg-gray-800 transition">&times;</button>
            </div>

            <!-- Embed Iframe Container -->
            <div class="relative w-full aspect-video bg-black">
                <iframe id="media-player" class="absolute inset-0 w-full h-full" src="" allowfullscreen scrolling="no" frameborder="0"></iframe>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Sample Mock Data (Replace or expand with your real IDs or API fetchers)
        const mediaDatabase = {
            anime: [
                { id: 21, title: "One Piece", poster: "https://cdn.myanimelist.net/images/anime/6/73245.jpg", type: "tv", season: 1, episode: 1 },
                { id: 1535, title: "Death Note", poster: "https://cdn.myanimelist.net/images/anime/9/9453.jpg", type: "tv", season: 1, episode: 1 }
            ],
            movie: [
                { id: 550, title: "Fight Club", poster: "https://image.tmdb.org/t/p/w500/pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg", type: "movie" },
                { id: 27205, title: "Inception", poster: "https://image.tmdb.org/t/p/w500/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg", type: "movie" }
            ],
            tv: [
                { id: 1396, title: "Breaking Bad", poster: "https://image.tmdb.org/t/p/w500/ztkUQFRFXphLRmrfqbuwXjOa7Xb.jpg", type: "tv", season: 1, episode: 1 },
                { id: 66732, title: "Stranger Things", poster: "https://image.tmdb.org/t/p/w500/49WJfeN0moxb9IPfGn8AIqMGskD.jpg", type: "tv", season: 1, episode: 1 }
            ]
        };

        // Embed Provider Templates
        const EMBED_PROVIDERS = {
            cinesrc: {
                movie: (id) => `https://cinesrc.st/embed/movie/${id}`,
                tv: (id, s, e) => `https://cinesrc.st/embed/tv/${id}/${s}/${e}`
            },
            vidlink: {
                movie: (id) => `https://vidlink.pro/movie/${id}?primaryColor=6366f1`,
                tv: (id, s, e) => `https://vidlink.pro/tv/${id}/${s}/${e}?primaryColor=6366f1`
            }
        };

        let currentCategory = 'anime';
        let activeItem = null;

        function switchCategory(category) {
            currentCategory = category;
            
            // Update button styles
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.dataset.category === category) {
                    btn.className = "cat-btn px-5 py-2 rounded-lg text-sm font-medium transition bg-accent text-white";
                } else {
                    btn.className = "cat-btn px-5 py-2 rounded-lg text-sm font-medium transition text-gray-400 hover:text-white";
                }
            });

            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('media-grid');
            const items = mediaDatabase[currentCategory] || [];
            
            grid.innerHTML = items.map(item => `
                <div onclick="openPlayer('${item.id}', '${item.type}', '${item.title}', ${item.season || 1}, ${item.episode || 1})" 
                     class="group bg-cardBg rounded-xl border border-gray-800 overflow-hidden cursor-pointer hover:border-accent transition duration-300 flex flex-col">
                    <div class="aspect-[2/3] w-full overflow-hidden relative bg-gray-900">
                        <img src="${item.poster}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    </div>
                    <div class="p-4 flex flex-col flex-grow justify-between">
                        <h3 class="font-semibold text-sm text-gray-200 group-hover:text-accent transition line-clamp-1">${item.title}</h3>
                        <span class="text-xs text-gray-500 uppercase tracking-wider mt-1">${item.type}</span>
                    </div>
                </div>
            `).join('');
        }

        function openPlayer(id, type, title, season, episode) {
            activeItem = { id, type, title, season, episode };
            document.getElementById('modal-title').innerText = title;
            
            const provider = document.getElementById('server-select').value;
            loadStream(provider);

            document.getElementById('player-modal').classList.remove('hidden');
        }

        function changeServer(provider) {
            if (!activeItem) return;
            loadStream(provider);
        }

        function loadStream(provider) {
            const iframe = document.getElementById('media-player');
            const url = activeItem.type === 'movie'
                ? EMBED_PROVIDERS[provider].movie(activeItem.id)
                : EMBED_PROVIDERS[provider].tv(activeItem.id, activeItem.season, activeItem.episode);
            
            iframe.src = url;
        }

        function closePlayer() {
            const iframe = document.getElementById('media-player');
            iframe.src = ""; // Stop video playback
            document.getElementById('player-modal').classList.add('hidden');
            activeItem = null;
        }

        // Initial render on load
        window.addEventListener('DOMContentLoaded', () => {
            renderGrid();
        });
    </script>
</body>
</html>
