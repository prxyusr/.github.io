<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyUser.dev</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --bg-color: #0b0c10;
            --text-color: #ffffff;
            --accent-border: rgba(255, 255, 255, 0.05);
            --terminal-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .top-bar {
            position: absolute;
            top: 25px; left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            display: flex; align-items: center; gap: 8px;
            font-size: 0.85rem; color: rgba(255, 255, 255, 0.45);
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(8px);
            padding: 6px 14px; border-radius: 20px;
            border: 1px solid var(--accent-border);
        }

        #click-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(11, 12, 16, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 5; cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #click-overlay.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }

        .click-text {
            font-size: 2rem; color: #ffffff;
            animation: pulse 1.8s infinite ease-in-out;
            letter-spacing: 2px;
        }

        #snowCanvas {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 103;
            contain: strict;
        }

        .main-container, .discord-invite, .expandable-menu, .top-bar, .spotify-widget {
            opacity: 0; pointer-events: none; transition: opacity 0.8s ease;
        }

        .main-container.fade-in, .discord-invite.fade-in, .expandable-menu.fade-in, .top-bar.fade-in, .spotify-widget.fade-in {
            opacity: 1; pointer-events: auto;
        }

        .main-container {
            position: relative; z-index: 2; text-align: center;
        }

        h1 { font-size: 3.5rem; text-shadow: 0 0 15px #fff; }

        .discord-invite {
            position: absolute; bottom: 35px; left: 50%;
            transform: translateX(-50%); z-index: 12;
            color: #ffffff; text-decoration: none;
            display: flex; align-items: center; justify-content: center;
            transition: color 0.2s, transform 0.2s;
        }
        .discord-invite svg { width: 24px; height: 24px; fill: currentColor; }
        .discord-invite:hover { color: #5865F2; transform: translateX(-50%) scale(1.1); }

        .expandable-menu {
            position: absolute; bottom: 40px; left: 40px; z-index: 13;
            display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 15px;
        }

        .menu-toggle { background: none; border: none; color: rgba(255, 255, 255, 0.6); cursor: pointer; padding: 5px; }
        .menu-toggle.active { transform: rotate(180deg); color: #fff; }

        .menu-items {
            max-height: 0; opacity: 0; overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            display: flex; flex-direction: column; gap: 12px;
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px);
            padding: 0 20px; border-radius: 8px; border: 1px solid transparent;
        }
        .menu-items.show { max-height: 380px; opacity: 1; padding: 20px; border-color: var(--accent-border); }
        .menu-item { font-size: 0.9rem; color: rgba(255, 255, 255, 0.7); text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; font-family: inherit; }
        .menu-item:hover { color: #fff; }

        .info-page {
            display: none; position: fixed; inset: 0; z-index: 95; overflow-y: auto;
            background: rgba(11, 15, 25, 0.97); backdrop-filter: blur(10px); color: #e5e7eb;
            padding: clamp(24px, 5vw, 64px); 
        }
        .info-page-inner { max-width: 900px; margin: 0 auto; }
        .info-page h2 { margin: 0 0 10px; font-size: clamp(1.8rem, 4vw, 2.6rem); }
        .info-page-close { margin-bottom: 26px; }

        .spotify-widget {
            position: absolute; bottom: 30px; right: 40px; z-index: 15;
            display: flex; flex-direction: column-reverse; align-items: flex-end; gap: 10px;
        }
        .spotify-toggle {
            background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #1DB954; padding: 8px 14px; border-radius: 20px; cursor: pointer;
            display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600;
            backdrop-filter: blur(8px); transition: background 0.2s, transform 0.2s;
        }
        .spotify-toggle:hover { background: rgba(30, 41, 59, 0.95); transform: scale(1.05); }
        .spotify-toggle svg { width: 16px; height: 16px; fill: currentColor; }
        
        .spotify-player-container {
            max-height: 0; opacity: 0; overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(12px);
            border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: flex; flex-direction: column; gap: 10px; width: 260px; color: #fff;
        }
        .spotify-player-container.show { max-height: 140px; opacity: 1; }
        .vibe-info { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; font-weight: 500; }
        .vibe-controls { display: flex; align-items: center; gap: 10px; font-size: 0.75rem; color: #b3b3b3; }
        .vibe-controls input[type="range"] { flex-grow: 1; accent-color: #1DB954; cursor: pointer; height: 4px; }
        .vibe-btn { background: #1DB954; color: #000; border: none; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; transition: transform 0.2s; }
        .vibe-btn:hover { transform: scale(1.1); }

        #terminal-overlay {
            position: fixed; top: -100%; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(11, 12, 16, 0.95); backdrop-filter: blur(15px);
            z-index: 40; transition: top 0.5s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex; justify-content: center; align-items: center; padding: 40px;
        }
        #terminal-overlay.active { top: 0; }

        .terminal-window {
            width: 850px; max-width: 95%; height: 550px;
            background: #050508; border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .terminal-header {
            background: rgba(255, 255, 255, 0.03); border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 15px; display: flex; justify-content: space-between; align-items: center;
            font-family: monospace; font-size: 0.80rem; color: rgba(255, 255, 255, 0.4);
        }

        .terminal-body {
            flex-grow: 1; padding: 20px; font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem; color: var(--terminal-color); overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
        }

        .terminal-output { white-space: pre-wrap; line-height: 1.4; }
        .terminal-input-row { display: flex; align-items: center; gap: 8px; }
        .terminal-prompt { font-weight: bold; }
        .terminal-input { background: transparent; border: none; outline: none; color: #fff; font-family: inherit; font-size: inherit; flex-grow: inherit; }

        .page-catalog {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(8px);
            z-index: 80; flex-direction: column; overflow-y: auto;
        }

        .catalog-header {
            background: rgba(17, 24, 39, 0.98); backdrop-filter: blur(10px);
            padding: 16px 40px; display: flex; align-items: center; justify-content: space-between;
            gap: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); flex-shrink: 0; width: 100%; position: relative;
        }
        .catalog-search {
            width: 100%; max-width: 450px; padding: 10px 18px;
            border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(31, 41, 55, 0.8); color: #fff; font-size: 0.95rem; outline: none;
            position: absolute; left: 50%; transform: translateX(-50%); text-align: center;
        }
        .catalog-socials-group { display: flex; align-items: center; gap: 16px; flex-shrink: 0; margin-left: auto; }
        .catalog-social-btn { color: #ffffff; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: color 0.2s, transform 0.2s; }
        .catalog-social-btn svg { width: 22px; height: 22px; fill: currentColor; }
        .catalog-social-btn.discord:hover { color: #5865F2; transform: scale(1.1); }

        .genre-bar {
            background: rgba(11, 15, 25, 0.98); backdrop-filter: blur(6px);
            padding: 14px 40px; display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden;
            scrollbar-width: thin; scrollbar-color: rgba(56, 189, 248, 0.3) transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); flex-shrink: 0; width: 100%;
        }

        .genre-pill {
            background: rgba(30, 41, 59, 0.8); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; white-space: nowrap;
            transition: all 0.2s ease; flex-shrink: 0;
        }
        .genre-pill:hover { background: rgba(56, 189, 248, 0.15); color: #fff; border-color: rgba(56, 189, 248, 0.3); }
        .genre-pill.active { background: #38bdf8; color: #ffffff; font-weight: bold; border-color: #38bdf8; }

        .catalog-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px; padding: 40px; max-width: 1300px; margin: 0 auto; width: 100%; flex-grow: 1;
        }
        .catalog-card {
            background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(5px);
            border-radius: 8px; overflow: hidden; cursor: pointer;
            transition: transform 0.2s, background 0.2s; display: flex; flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.05); position: relative; height: fit-content;
        }
        .catalog-card:hover { transform: translateY(-5px); background: rgba(30, 41, 59, 0.95); }
        .catalog-card img { width: 100%; height: 240px; object-fit: cover; }
        .catalog-card-info { padding: 12px; }
        .catalog-card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .catalog-card-sub { font-size: 0.75rem; color: #94a3b8; }

        #details-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); z-index: 90; justify-content: center; align-items: center; padding: 20px;
        }
        .details-box {
            background: #1e293b; width: 100%; max-width: 750px; border-radius: 12px;
            overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9); border: 1px solid #334155;
        }
        .details-content { display: flex; gap: 20px; padding: 30px; }
        .details-content img { width: 200px; height: 280px; object-fit: cover; border-radius: 8px; }
        .details-info { display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }
        .details-info h2 { font-size: 1.6rem; color: #f8fafc; }
        .details-badge {
            display: inline-block; background: #38bdf8; color: #0f172a;
            font-weight: bold; font-size: 0.85rem; padding: 4px 10px; border-radius: 4px; width: fit-content;
        }
        .details-meta { font-size: 0.9rem; color: #94a3b8; line-height: 1.5; }
        .details-footer {
            background: #111827; padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #334155;
        }
        .btn-primary { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .btn-primary:hover { background: #0284c7; color: #fff; }
        .btn-secondary { background: #334155; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }

        #player-view {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(11, 12, 16, 0.95); z-index: 100;
            justify-content: center; align-items: center; padding: 24px; gap: 20px;
        }
        .player-main-col { display: flex; flex-direction: column; width: 100%; max-width: 820px; height: 85vh; background: #1e293b; border-radius: 12px; overflow: hidden; }
        
        .video-container { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 48vh; background: #000; flex-shrink: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .player-controls { padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; background: #111827; flex-shrink: 0; }
        
        .player-info-panel {
            flex-grow: 1; background: #111827; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; border-top: 1px solid #334155;
            scrollbar-width: thin; scrollbar-color: rgba(56, 189, 248, 0.4) transparent;
        }
        .player-info-top { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .player-anime-title { font-size: 1.2rem; font-weight: bold; color: #f8fafc; }
        .player-synopsis { font-size: 0.85rem; color: #94a3b8; line-height: 1.5; }

        .episodes-sidebar {
            width: 320px; height: 85vh; background: #111827; border: 1px solid #334155;
            border-radius: 12px; display: flex; flex-direction: column; overflow: hidden;
        }
        .episodes-header { padding: 15px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }
        .episodes-title-row { display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #f8fafc; font-size: 0.95rem; }
        .episodes-list { flex-grow: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; scrollbar-width: thin; scrollbar-color: rgba(56, 189, 248, 0.4) transparent; }
        .ep-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 6px;
            background: rgba(30, 41, 59, 0.4); cursor: pointer; transition: all 0.2s; color: #cbd5e1; font-size: 0.85rem;
        }
        .ep-item:hover { background: rgba(56, 189, 248, 0.15); color: #fff; }
        .ep-item.active { background: rgba(244, 63, 94, 0.2); border: 1px solid rgba(244, 63, 94, 0.4); color: #f43f5e; font-weight: bold; }
        .ep-num { font-weight: bold; min-width: 24px; color: #94a3b8; }
        .ep-item.active .ep-num { color: #f43f5e; }
        .ep-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; }

        .home-version { margin-top: 12px; color: #8b95a7; font-size: .72rem; letter-spacing: .22em; text-transform: uppercase; }
        .home-version span { display: inline-block; padding: 5px 10px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; background: rgba(255,255,255,.035); }
        
        #closePlayer { padding: 8px 12px; border-radius: 8px; font-weight: 650; background: rgba(248,113,113,.13) !important; color: #fca5a5; border: 1px solid rgba(248,113,113,.28); }
        #closePlayer:hover { background: rgba(248,113,113,.24) !important; }

        @media (max-width: 1100px) {
            #player-view { overflow-y: auto; align-items: flex-start; flex-direction: column; }
            .player-main-col { width: 100%; height: auto; min-height: 0; flex: 0 0 auto; }
            .episodes-sidebar { width: 100%; flex: 0 0 auto; height: 38vh; min-height: 220px; }
        }
    </style>
</head>
<body>
    <div class="top-bar" id="topBar">
        <i data-lucide="eye"></i>
        <span>views: <span id="site_views_counter">...</span></span>
    </div>

    <div id="click-overlay">
        <div class="click-text">𝐂𝐥𝐢𝐜𝐤 𝐌𝐞</div>
    </div>

    <canvas id="snowCanvas"></canvas>

    <div class="main-container" id="mainContainer">
        <h1><b> 𝐏𝐫𝐨𝐱𝐲 𝐔𝐬𝐞𝐫 </b></h1>
        <div class="home-version"><span>Update 1.0.8</span></div>
    </div>

    <div class="spotify-widget" id="spotifyWidget">
        <button class="spotify-toggle" id="spotifyToggle">
            <svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.599-.12-.42.18-.78.6-.9 4.56-1.021 8.52-.6 11.64 1.32.36.18.48.66.24 1.08zm1.44-3.84c-.301.48-.901.66-1.381.36-3.24-1.98-8.16-2.58-11.94-1.38-.54.18-1.14-.12-1.32-.66-.18-.54.12-1.14.66-1.32 4.38-1.38 9.84-.72 13.62 1.56.48.3.66.9.36 1.38zm.12-4.08C13.5 7.32 7.8 7.14 4.62 8.1c-.66.18-1.38-.18-1.56-.84-.18-.66.18-1.38.84-1.56 3.78-1.14 10.2-.9 14.76 1.86.6.36.78 1.14.42 1.74-.36.6-1.14.78-1.74.42z"/></svg>
            Ambient Audio
        </button>
        <div class="spotify-player-container" id="spotifyContainer">
            <div class="vibe-info">
                <span>Ambient Audio</span>
                <button class="vibe-btn" id="vibePlayBtn">❚❚</button>
            </div>
            <div class="vibe-controls">
                <span>Vol:</span>
                <input type="range" id="vibeVolume" min="0" max="100" value="15">
                <span id="vibeVolVal">15%</span>
            </div>
        </div>
    </div>

    <div id="terminal-overlay">
        <div class="terminal-window">
            <div class="terminal-header">
                <div>terminal@user:~</div>
                <div>press [TAB] to close</div>
            </div>
            <div class="terminal-body" id="terminalBody">
                <div class="terminal-output" id="terminalOutput">Proxy OS [Version 1.0.8]
Type "help" for commands.

</div>
                <div class="terminal-input-row">
                    <span class="terminal-prompt">></span>
                    <input type="text" class="terminal-input" id="terminalInput" autocomplete="off" spellcheck="false" autofocus>
                </div>
            </div>
        </div>
    </div>

    <div id="catalog-page" class="page-catalog">
        <div class="catalog-header">
            <input type="text" id="catalogSearchInput" class="catalog-search" placeholder="Search anime title...">
            <div class="catalog-socials-group">
                <a href="https://discord.gg/Jw8mYr3nrb" target="_blank" class="catalog-social-btn discord" title="Join Discord">
                    <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                </a>
                <button class="btn-secondary btn-close" onclick="closeCatalogUI('anime')">Close</button>
            </div>
        </div>
        <div class="genre-bar" id="animeGenreBar">
            <button class="genre-pill active" data-genre="all">All Popular Anime</button>
        </div>
        <div class="catalog-grid" id="catalogGridAnime"></div>
    </div>

    <div id="media-catalog-page" class="page-catalog">
        <div class="catalog-header">
            <input type="text" id="mediaCatalogSearchInput" class="catalog-search" placeholder="Search Movies or TV shows...">
            <div class="catalog-socials-group">
                <button class="btn-secondary btn-close" onclick="closeCatalogUI('movies')">Close</button>
            </div>
        </div>
        <div class="genre-bar" id="moviesGenreBar">
            <button class="genre-pill active" data-genre="all">Trending Movies & TV</button>
            <button class="genre-pill" data-genre="MOVIE">🎬 Movies Only</button>
            <button class="genre-pill" data-genre="TV">📺 TV Shows Only</button>
        </div>
        <div class="catalog-grid" id="catalogGridMovies"></div>
    </div>

    <div id="details-modal">
        <div class="details-box">
            <div class="details-content">
                <img id="detailImg" src="" alt="Poster">
                <div class="details-info">
                    <span class="details-badge" id="detailType">TV</span>
                    <h2 id="detailTitle">Title</h2>
                    <div class="details-meta" id="detailMeta">
                        <p><strong>ID:</strong> <span id="detailId" style="color: #38bdf8; font-weight: bold;"></span></p>
                        <p><strong>Release:</strong> <span id="detailDate">N/A</span></p>
                        <p id="detailSynopsis" style="margin-top: 10px; font-size: 0.85rem; color: #cbd5e1;"></p>
                    </div>

            </div>
            <div class="details-footer">
                <button class="btn-secondary" id="closeDetails">Back</button>
                <button class="btn-primary" id="watchBtn">Watch Stream</button>

    <div id="player-view">
        <div class="player-main-col">
            <div class="video-container" id="videoWrapper"></div>
            <div class="player-controls">
                <div style="display:flex; gap:10px; align-items:center; color:#fff; flex-wrap:wrap;">
                    <label id="seasonNumLabel" style="display:none;">Season: <input type="number" id="seasonNum" value="1" min="1" style="width:55px; padding:4px; background:#0f172a; color:#fff; border:1px solid #334155; border-radius:4px;"></label>
                    <label id="epNumLabel">Ep: <input type="number" id="epNum" value="1" min="1" style="width:60px; padding:4px; background:#0f172a; color:#fff; border:1px solid #334155; border-radius:4px;"></label>
                    <select id="trackSel" style="padding:4px; background:#0f172a; color:#fff; border:1px solid #334155; border-radius:4px;">

                    </select>
                    <select id="serverSel" style="display:none; padding:4px; background:#0f172a; color:#fff; border:1px solid #334155; border-radius:4px;">
                        <option value="cinesrc" selected>CineSrc (Primary)</option>
                        <option value="vidlink">VidLink (Backup)</option>
                    </select>
                </div>
                <button class="btn-secondary" id="closePlayer" style="background:#ef4444;">Exit Player</button>
            </div>
            <div class="player-info-panel" id="playerInfoPanel">
                <div class="player-info-top">
                    <div class="player-anime-title" id="playerAnimeTitle">Title</div>
                </div>
                <div class="player-synopsis" id="playerAnimeSynopsis"></div>
            </div>
        </div>
        <div class="episodes-sidebar" id="episodesSidebar">
            <div class="episodes-header">
                <div class="episodes-title-row"><span>List of episodes:</span></div>
            </div>
            <div class="episodes-list" id="episodesListContainer"></div>
        </div>
    </div>

    <section class="info-page" id="changelogPage">
        <div class="info-page-inner">
            <button class="btn-secondary info-page-close" type="button" data-close-info>← Back to Home</button>
            <h2>Changelog</h2>
        </div>
    </section>

    <a href="https://discord.gg/Jw8mYr3nrb" target="_blank" class="discord-invite" id="discordInvite"><svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg></a>

    <div class="expandable-menu" id="expandableMenu">
        <button class="menu-toggle" id="menuToggle"><i data-lucide="chevron-up"></i></button>
        <div class="menu-items" id="menuItems">
            <button type="button" class="menu-item" id="openAnimeCatalogMenu">Anime Catalog</button>
            <button type="button" class="menu-item" id="openMoviesCatalogMenu">Movies & TV Catalog</button>
            <button type="button" class="menu-item" id="openChangelogMenu">Changelog</button>
            <a href="https://discord.gg/Jw8mYr3nrb" target="_blank" class="menu-item">Discord</a>
            <a href="https://github.com/prxyusr" target="_blank" class="menu-item">GitHub</a>
        </div>
    </div>

    <audio id="vibeAudio" src="1026.MP3" preload="auto" loop playsinline></audio>

    <script>
        async function updateViewsCounter() {
            try {
                const hasCounted = sessionStorage.getItem('proxy_viewed');
                const endpoint = hasCounted 
                    ? 'https://api.counterapi.dev/v1/proxyusr_dev/views' 
                    : 'https://api.counterapi.dev/v1/proxyusr_dev/views/up';
                
                const res = await fetch(endpoint);
                const data = await res.json();
                document.getElementById('site_views_counter').textContent = data?.count?.toLocaleString() || '1,240';
                if (!hasCounted) sessionStorage.setItem('proxy_viewed', 'true');
            } catch (e) { document.getElementById('site_views_counter').textContent = '1,240'; }
        }
        updateViewsCounter();

        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
        let width = window.innerWidth, height = window.innerHeight, pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
        const flakes = [];
        for (let i = 0; i < 90; i++) flakes.push({ x: Math.random() * width, y: Math.random() * height, radius: Math.random() * 2.2 + 0.8, speedY: 30 + Math.random() * 35, speedX: (Math.random() - 0.5) * 16, opacity: Math.random() * 0.55 + 0.25 });
        
        function resizeSnowCanvas() {
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = Math.round(width * pixelRatio); canvas.height = Math.round(height * pixelRatio);
            canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
            ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        }
        window.addEventListener('resize', resizeSnowCanvas);
        resizeSnowCanvas();

        let lastFrame = 0;
        function drawSnow(timestamp) {
            if (document.hidden) { lastFrame = 0; requestAnimationFrame(drawSnow); return; }
            const dt = lastFrame ? Math.min((timestamp - lastFrame) / 1000, 0.05) : 0;
            lastFrame = timestamp;
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#fff';
            for (const f of flakes) {
                ctx.globalAlpha = f.opacity;
                ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2); ctx.fill();
                f.y += f.speedY * dt; f.x += f.speedX * dt;
                if (f.y > height + f.radius) { f.y = -f.radius; f.x = Math.random() * width; }
                if (f.x > width + f.radius) f.x = -f.radius; else if (f.x < -f.radius) f.x = width + f.radius;
            }
            requestAnimationFrame(drawSnow);
        }
        requestAnimationFrame(drawSnow);
        lucide.createIcons();

        const menuToggle = document.getElementById('menuToggle'), menuItems = document.getElementById('menuItems');
        menuToggle.addEventListener('click', (e) => { e.stopPropagation(); menuToggle.classList.toggle('active'); menuItems.classList.toggle('show'); });

        const changelogPage = document.getElementById('changelogPage');
        function closeInfoPages() { changelogPage.style.display = 'none'; }

        document.getElementById('openAnimeCatalogMenu').addEventListener('click', () => { menuToggle.classList.remove('active'); menuItems.classList.remove('show'); openCatalogUI('anime'); });
        document.getElementById('openMoviesCatalogMenu').addEventListener('click', () => { menuToggle.classList.remove('active'); menuItems.classList.remove('show'); openCatalogUI('movies'); });
        document.getElementById('openChangelogMenu').addEventListener('click', () => { menuToggle.classList.remove('active'); menuItems.classList.remove('show'); changelogPage.style.display = 'block'; });
        document.querySelectorAll('[data-close-info]').forEach(b => b.addEventListener('click', closeInfoPages));

        const spotifyToggle = document.getElementById('spotifyToggle'), spotifyContainer = document.getElementById('spotifyContainer'), vibePlayBtn = document.getElementById('vibePlayBtn'), vibeVolume = document.getElementById('vibeVolume'), vibeVolVal = document.getElementById('vibeVolVal'), vibeAudio = document.getElementById('vibeAudio');
        vibeAudio.volume = 0.15;
        spotifyToggle.addEventListener('click', (e) => { e.stopPropagation(); spotifyContainer.classList.toggle('show'); });
        vibePlayBtn.addEventListener('click', () => { if (vibeAudio.paused) { vibeAudio.play(); vibePlayBtn.textContent = '❚❚'; } else { vibeAudio.pause(); vibePlayBtn.textContent = '▶'; } });
        vibeVolume.addEventListener('input', (e) => { vibeVolVal.textContent = `${e.target.value}%`; vibeAudio.volume = e.target.value / 100; });

        const overlay = document.getElementById('click-overlay');
        overlay.addEventListener('click', () => {
            overlay.classList.add('fade-out');
            document.getElementById('mainContainer').classList.add('fade-in');
            document.getElementById('discordInvite').classList.add('fade-in');
            document.getElementById('expandableMenu').classList.add('fade-in');
            document.getElementById('topBar').classList.add('fade-in');
            document.getElementById('spotifyWidget').classList.add('fade-in');
            vibeAudio.play().catch(e => {});
        });

        const terminalOverlay = document.getElementById('terminal-overlay'), terminalInput = document.getElementById('terminalInput'), terminalOutput = document.getElementById('terminalOutput');
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') { e.preventDefault(); terminalOverlay.classList.toggle('active'); if (terminalOverlay.classList.contains('active')) terminalInput.focus(); }
            else if (e.key === 'Escape') {
                if (document.getElementById('details-modal').style.display === 'flex') document.getElementById('details-modal').style.display = 'none';
                else if (document.getElementById('player-view').style.display === 'flex') exitPlayerToCatalog();
                else if (document.getElementById('catalog-page').style.display === 'flex') closeCatalogUI('anime');
                else if (document.getElementById('media-catalog-page').style.display === 'flex') closeCatalogUI('movies');
            }
        });

        terminalInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const cmd = terminalInput.value.trim().toLowerCase(); terminalInput.value = '';
                if (cmd === 'acat' || cmd === 'anime') { terminalOverlay.classList.remove('active'); openCatalogUI('anime'); }
                else if (cmd === 'mcat' || cmd === 'movies') { terminalOverlay.classList.remove('active'); openCatalogUI('movies'); }
                else if (cmd === 'clear') terminalOutput.innerHTML = '';
            }
        });

        let liveAnimeList = [], liveMoviesList = [], activeAnime = null;
        let currentFilterType = 'all';

        async function fetchTMDBTrending() {
            try {
                // Fetch real trending movies and TV shows from TMDB via a clean public API or fallback list
                const res = await fetch('https://api.themoviedb.org/3/trending/all/week?api_key=3d941584e03f5dbff8fc272379f8da98');
                const data = await res.json();
                if (data && data.results) {
                    liveMoviesList = data.results.map(item => ({
                        id: item.id,
                        title: item.title || item.name || 'Untitled',
                        type: (item.media_type === 'movie' ? 'MOVIE' : 'TV'),
                        mediaSource: 'tmdb',
                        image: item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://image.tmdb.org/t/p/w500/u3bZgnGQ9T01sWNhyve4z0wH0Hl.jpg',
                        date: (item.release_date || item.first_air_date || '2024').substring(0, 4),
                        episodesCount: item.media_type === 'tv' ? 10 : 1,
                        synopsis: item.overview || 'No synopsis available.'
                    }));
                    renderCatalogCards('movies');
                }
            } catch (err) {
                // Fallback list if network/API fails
                liveMoviesList = [
                    { id: 157336, title: "Interstellar", type: "MOVIE", mediaSource: "tmdb", image: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg", date: "2014", episodesCount: 1, synopsis: "Explorers travel through a wormhole in space." },
                    { id: 693134, title: "Dune: Part Two", type: "MOVIE", mediaSource: "tmdb", image: "https://image.tmdb.org/t/p/w500/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg", date: "2024", episodesCount: 1, synopsis: "Paul Atreides unites with Chani and the Fremen." },
                    { id: 66732, title: "Stranger Things", type: "TV", mediaSource: "tmdb", image: "https://image.tmdb.org/t/p/w500/49WJfeN0moxb9IPfGn8AIqMGskD.jpg", date: "2016", episodesCount: 34, synopsis: "A small town uncovers a mystery involving supernatural forces." },
                    { id: 100088, title: "The Last of Us", type: "TV", mediaSource: "tmdb", image: "https://image.tmdb.org/t/p/w500/u3bZgnGQ9T01sWNhyve4z0wH0Hl.jpg", date: "2023", episodesCount: 9, synopsis: "Surviving in a post-apocalyptic world." },
                    { id: 82856, title: "The Mandalorian", type: "TV", mediaSource: "tmdb", image: "https://image.tmdb.org/t/p/w500/eU1i6eHXlzMOlEq0ku1R97Y4hnY.jpg", date: "2019", episodesCount: 24, synopsis: "The travels of a lone bounty hunter." },
                    { id: 1396, title: "Breaking Bad", type: "TV", mediaSource: "tmdb", image: "https://image.tmdb.org/t/p/w500/ztkUQFRFXphLRmrfqbuwXjOa7Xb.jpg", date: "2008", episodesCount: 62, synopsis: "A chemistry teacher turns to manufacturing." }
                ];
                renderCatalogCards('movies');
            }
        }

        function openCatalogUI(type) {
            if (type === 'anime') {
                document.getElementById('catalog-page').style.display = 'flex';
                document.getElementById('media-catalog-page').style.display = 'none';
                if (liveAnimeList.length === 0) fetchAnimeData();
            } else {
                document.getElementById('media-catalog-page').style.display = 'flex';
                document.getElementById('catalog-page').style.display = 'none';
                if (liveMoviesList.length === 0) fetchTMDBTrending();
            }
        }

        function closeCatalogUI(type) {
            document.getElementById(type === 'anime' ? 'catalog-page' : 'media-catalog-page').style.display = 'none';
        }

        async function fetchAnimeData() {
            try {
                const res = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: `query { Page(page: 1, perPage: 24) { media(type: ANIME, sort: POPULARITY_DESC) { id idMal title { romaji english } type coverImage { large } startDate { year } genres episodes description } } }` })
                });
                const data = await res.json();
                liveAnimeList = data.data.Page.media.map(item => ({
                    id: item.idMal, title: item.title.english || item.title.romaji, type: 'ANIME', mediaSource: 'anime',
                    image: item.coverImage?.large || '', date: item.startDate?.year || 'N/A', genres: item.genres || [],
                    episodesCount: item.episodes || 12, synopsis: item.description?.replace(/<[^>]*>?/gm, '') || 'No synopsis.'
                }));
                renderCatalogCards('anime');
            } catch (e) {}
        }

        function renderCatalogCards(mode) {
            const grid = document.getElementById(mode === 'anime' ? 'catalogGridAnime' : 'catalogGridMovies');
            let list = mode === 'anime' ? liveAnimeList : liveMoviesList;

            if (mode === 'movies' && currentFilterType !== 'all') {
                list = list.filter(i => i.type === currentFilterType);
            }

            grid.innerHTML = list.map(item => `
                <div class="catalog-card" onclick="showMediaDetails(${item.id}, '${mode}')">
                    <img src="${item.image}" alt="${item.title}" loading="lazy">
                    <div class="catalog-card-info">
                        <div class="catalog-card-title">${item.title}</div>
                        <div class="catalog-card-sub">${item.type} • ${item.date}</div>
                    </div>
                </div>
            `).join('');
        }

        document.querySelectorAll('#moviesGenreBar .genre-pill').forEach(pill => {
            pill.addEventListener('click', (e) => {
                document.querySelectorAll('#moviesGenreBar .genre-pill').forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                currentFilterType = pill.getAttribute('data-genre');
                renderCatalogCards('movies');
            });
        });

        window.showMediaDetails = function(id, mode) {
            activeAnime = (mode === 'anime' ? liveAnimeList : liveMoviesList).find(i => i.id === id);
            if (!activeAnime) return;
            document.getElementById('detailImg').src = activeAnime.image;
            document.getElementById('detailTitle').textContent = activeAnime.title;
            document.getElementById('detailId').textContent = activeAnime.id;
            document.getElementById('detailDate').textContent = activeAnime.date;
            document.getElementById('detailSynopsis').textContent = activeAnime.synopsis;
            document.getElementById('details-modal').style.display = 'flex';
        };

        document.getElementById('closeDetails').addEventListener('click', () => { document.getElementById('details-modal').style.display = 'none'; });
        document.getElementById('watchBtn').addEventListener('click', () => {
            document.getElementById('details-modal').style.display = 'none';
            document.getElementById('catalog-page').style.display = 'none';
            document.getElementById('media-catalog-page').style.display = 'none';
            openPlayerStream();
        });

        // PLAYER STREAMING SYSTEM (Fixed TMDB Movie & TV URLs + Sandbox Adblocker)
        const playerView = document.getElementById('player-view');
        const videoWrapper = document.getElementById('videoWrapper');
        const epNum = document.getElementById('epNum');
        const seasonNum = document.getElementById('seasonNum');
        const seasonNumLabel = document.getElementById('seasonNumLabel');
        const trackSel = document.getElementById('trackSel');
        const serverSel = document.getElementById('serverSel');

        function openPlayerStream() {
            if (!activeAnime) return;
            const ep = epNum.value || 1;
            const season = seasonNum.value || 1;
            const server = serverSel.value || 'cinesrc';

            document.getElementById('playerAnimeTitle').textContent = activeAnime.title;
            document.getElementById('playerAnimeSynopsis').textContent = activeAnime.synopsis;

            if (activeAnime.mediaSource === 'tmdb') {
                trackSel.style.display = 'none';
                serverSel.style.display = 'block';

                let embedUrl = '';
                // Robust sandbox adblocker/popup blocker string
                const sandboxAdblockAttr = 'sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock"';

                if (activeAnime.type === 'MOVIE') {
                    seasonNumLabel.style.display = 'none';
                    // Correct standard CineSrc and VidLink Movie Embed URLs
                    embedUrl = server === 'cinesrc' 
                        ? `https://cinesrc.st/embed/movie/${activeAnime.id}` 
                        : `https://vidlink.pro/movie/${activeAnime.id}?primaryColor=38bdf8`;
                } else {
                    // Correct standard CineSrc and VidLink TV Show Embed URLs with Season & Episode
                    seasonNumLabel.style.display = 'flex';
                    embedUrl = server === 'cinesrc' 
                        ? `https://cinesrc.st/embed/tv/${activeAnime.id}/${season}/${ep}` 
                        : `https://vidlink.pro/tv/${activeAnime.id}/${season}/${ep}?primaryColor=38bdf8`;
                }

                videoWrapper.innerHTML = `<iframe src="${embedUrl}" ${sandboxAdblockAttr} allowfullscreen></iframe>`;
                document.getElementById('episodesSidebar').style.display = activeAnime.type === 'MOVIE' ? 'none' : 'flex';
                renderDummyEpisodes(activeAnime.episodesCount || 10);
            } else {
                trackSel.style.display = 'block';
                serverSel.style.display = 'none';
                seasonNumLabel.style.display = 'none';
                
                // Anime un-sandboxed/permissive view as required
                videoWrapper.innerHTML = `<iframe src="https://zokoanime.video/stream/mal/${activeAnime.id}/${ep}/sub?color=38bdf8" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock allow-presentation allow-orientation-lock" allowfullscreen></iframe>`;
                document.getElementById('episodesSidebar').style.display = 'flex';
                renderDummyEpisodes(activeAnime.episodesCount || 24);
            }

            playerView.style.display = 'flex';
        }

        function renderDummyEpisodes(total) {
            document.getElementById('episodesListContainer').innerHTML = Array.from({length: total}, (_, i) => `
                <div class="ep-item ${i+1 == epNum.value ? 'active' : ''}" onclick="selectEp(${i+1})">
                    <span class="ep-num">${i+1}</span><span class="ep-name">Episode ${i+1}</span>
                </div>
            `).join('');
        }

        window.selectEp = function(num) { epNum.value = num; openPlayerStream(); };

        function exitPlayerToCatalog() {
            playerView.style.display = 'none';
            videoWrapper.innerHTML = '';
            openCatalogUI(activeAnime.mediaSource === 'tmdb' ? 'movies' : 'anime');
        }

        epNum.addEventListener('change', openPlayerStream);
        seasonNum.addEventListener('change', openPlayerStream);
        serverSel.addEventListener('change', openPlayerStream);
        document.getElementById('closePlayer').addEventListener('click', exitPlayerToCatalog);
    </script>
