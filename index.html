<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyUser.dev - Simple Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background: #111827;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
        }

        .logo { font-size: 1.5rem; font-weight: bold; color: #38bdf8; text-decoration: none; }

        .main-container {
            width: 100%;
            max-width: 900px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex-grow: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .search-box button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .search-box button:hover { background: #0284c7; color: #fff; }

        .player-wrapper {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .video-container {
            position: relative;
            padding-top: 56.25%;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        .controls-bar {
            padding: 15px 20px;
            background: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group label { font-size: 0.9rem; color: #94a3b8; }

        .control-group input, .control-group select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 0.95rem;
        }

        .control-group input { width: 80px; }

        .placeholder-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #64748b;
            font-size: 1.1rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <span class="logo">ProxyUser.dev</span>
    </header>

    <div class="main-container">
        <!-- Input ID Box -->
        <div class="search-box">
            <input type="text" id="malIdInput" placeholder="Enter MyAnimeList ID (e.g. 21 for One Piece, 16498 for Attack on Titan)">
            <button id="loadBtn">Load Player</button>
        </div>

        <!-- Video Player Display -->
        <div class="player-wrapper">
            <div class="video-container" id="videoWrapper">
                <div class="placeholder-text">Enter a MyAnimeList ID above to load stream</div>
            </div>
            <div class="controls-bar">
                <div class="control-group">
                    <label>Episode:</label>
                    <input type="number" id="epNumber" value="1" min="1">
                </div>
                <div class="control-group">
                    <label>Audio:</label>
                    <select id="trackType">
                        <option value="sub">Subtitled</option>
                        <option value="dub">Dubbed</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentAnimeId = null;

        const malIdInput = document.getElementById('malIdInput');
        const loadBtn = document.getElementById('loadBtn');
        const videoWrapper = document.getElementById('videoWrapper');
        const epInput = document.getElementById('epNumber');
        const trackSelect = document.getElementById('trackType');

        function updateEmbed() {
            if (!currentAnimeId) return;

            const ep = epInput.value || 1;
            const track = trackSelect.value || 'sub';

            videoWrapper.innerHTML = `
                <iframe src="https://zokoanime.video/stream/mal/${currentAnimeId}/${ep}/${track}?color=38bdf8" allowfullscreen></iframe>
            `;
        }

        loadBtn.addEventListener('click', () => {
            const val = malIdInput.value.trim();
            if (val) {
                currentAnimeId = val;
                updateEmbed();
            }
        });

        malIdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadBtn.click();
            }
        });

        epInput.addEventListener('change', updateEmbed);
        trackSelect.addEventListener('change', updateEmbed);
    </script>
</body>
</html>
