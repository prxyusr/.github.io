<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyUser - Anime Stream Tester</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
        }
        h2 { margin-bottom: 20px; }
        label { display: block; margin-top: 10px; font-size: 0.9rem; }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            background: #3b82f6;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Stream Tester</h2>
        <form id="stream-form">
            <label for="id">Anime ID (MAL/AniList):</label>
            <input type="text" id="id" placeholder="e.g. 21" required>

            <label for="ep">Episode:</label>
            <input type="number" id="ep" value="1" min="1" required>

            <label for="type">Provider ID Type:</label>
            <select id="type">
                <option value="mal">MyAnimeList (MAL)</option>
                <option value="anilist">AniList</option>
            </select>

            <label for="track">Audio Track:</label>
            <select id="track">
                <option value="sub">Sub</option>
                <option value="dub">Dub</option>
                <option value="hsub">HardSub</option>
            </select>

            <button type="submit">Watch Stream</button>
        </form>
    </div>

    <script>
        document.getElementById('stream-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('id').value;
            const ep = document.getElementById('ep').value;
            const type = document.getElementById('type').value;
            const track = document.getElementById('track').value;

            window.location.href = `watch.html?id=${id}&ep=${ep}&type=${type}&track=${track}`;
        });
    </script>

</body>
</html>
