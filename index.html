<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyUser - Anime Station</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --bg-color: #0b0c10;
            --text-color: #ffffff;
            --accent-border: rgba(255, 255, 255, 0.05);
            --accent-btn-hover: rgba(255, 255, 255, 0.1);
            --accent-text-glow: #ffffff;
            --terminal-color: #ffffff;
            
            /* Enhanced Streaming Platform Engine Variables */
            --glass-panel: rgba(255, 255, 255, 0.02);
            --glass-panel-active: rgba(255, 255, 255, 0.06);
            --panel-blur: blur(12px);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.8s ease, color 0.8s ease;
        }

        /* ---------------------------------------------------- */
        /* MOBILE BLOCKER STYLING                               */
        /* ---------------------------------------------------- */
        #mobile-blocker {
            display: none;
        }

        @media (max-width: 992px) {
            .main-container, .top-bar, .discord-invite, .expandable-menu, #click-overlay {
                display: none !important;
            }
            #mobile-blocker {
                display: flex !important;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: #0b0c10;
                color: #ffffff;
                text-align: center;
                z-index: 10;
                padding: 20px;
            }
            #mobile-blocker h1 {
                font-size: 2.2rem;
                margin-bottom: 15px;
                letter-spacing: 1.5px;
            }
            #mobile-blocker p {
                font-size: 1rem;
                color: rgba(255, 255, 255, 0.6);
            }
        }

        /* Top Header Area for View Counter */
        .top-bar {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.45);
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: var(--panel-blur);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--accent-border);
            letter-spacing: 0.5px;
        }

        /* Click to Enter Overlay */
        #click-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(11, 12, 16, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #click-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .click-text {
            font-size: 2rem;
            color: #ffffff;
            letter-spacing: 2px;
            animation: pulse 1.8s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* Hidden Main Elements */
        .main-container, .discord-invite, .expandable-menu, .top-bar {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .main-container.fade-in, .discord-invite.fade-in, .expandable-menu.fade-in, .top-bar.fade-in {
            opacity: 1;
            pointer-events: auto;
        }

        /* Main Content Workspace Layout Matrix */
        .main-container {
            position: relative;
            z-index: 2;
            width: 85vw;
            max-width: 1400px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .platform-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--accent-border);
            padding-bottom: 12px;
        }

        h1 {
            font-size: 2.2rem;
            opacity: 0.95;
            text-shadow: 0 0 15px var(--accent-text-glow);
            letter-spacing: 1px;
        }

        /* Main Media Matrix Application Workspace */
        .streaming-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
            flex: 1;
            min-height: 0;
        }

        /* Sidebar Directory Engine Layout */
        .anime-sidebar {
            background: var(--glass-panel);
            backdrop-filter: var(--panel-blur);
            border: 1px solid var(--accent-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 4px;
        }

        .anime-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .anime-card:hover {
            background: var(--glass-panel-active);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateX(4px);
        }

        .anime-card.active {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.03);
        }

        .anime-thumb {
            width: 45px;
            height: 60px;
            border-radius: 4px;
            background-size: cover;
            background-position: center;
            border: 1px solid var(--accent-border);
            flex-shrink: 0;
        }

        .anime-info {
            overflow: hidden;
            text-align: left;
        }

        .anime-title {
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: text-overflow;
            text-overflow: ellipsis;
            color: rgba(255, 255, 255, 0.9);
        }

        .anime-meta {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
        }

        /* Active Core Processing Stage Layer */
        .stage-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 0;
        }

        .player-viewport {
            position: relative;
            width: 100%;
            flex: 1;
            background: #000000;
            border-radius: 12px;
            border: 1px solid var(--accent-border);
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .player-viewport iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Episode Navigation Array Matrix */
        .episode-matrix-wrapper {
            background: var(--glass-panel);
            backdrop-filter: var(--panel-blur);
            border: 1px solid var(--accent-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .matrix-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .active-meta-display {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .episode-grid {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .episode-node {
            min-width: 45px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--accent-border);
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.2s ease;
        }

        .episode-node:hover {
            background: var(--glass-panel-active);
            color: #ffffff;
