<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyUser - Anime Directory</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #111827;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo { font-size: 1.5rem; font-weight: bold; color: #38bdf8; text-decoration: none; }

        .search-bar {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        .search-bar input {
            width: 100%;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #fff;
            outline: none;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            flex-wrap: wrap;
            gap: 15px;
            background: #0f172a;
        }

        .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
        .tab {
            padding: 8px 16px;
            background: #1e293b;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            user-select: none;
        }
        .tab.active { background: #38bdf8; color: #0f172a; font-weight: bold; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            padding: 30px;
            flex-grow: 1;
        }

        .card {
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
        }

        .card-info { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 0.9rem; font-weight: 600; line-height: 1.2; margin-bottom: 6px; }
        .card-sub { font-size: 0.75rem; color: #94a3b8; }

        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* Modal Player */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: #1e293b;
            width: 100%;
            max-width: 900px;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .video-container {
            position: relative;
            padding-top: 56.25%;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: none;
        }
        .modal-body {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .ep-controls { display: flex; gap: 10px; align-items: center; }
        .ep-controls input { width: 70px; padding: 6px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #fff; }
        .close-btn { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">ProxyUser.dev</a>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search anime title...">
        </div>
    </header>

    <div class="controls">
        <div class="tabs">
            <div class="tab active" data-type="">All</div>
            <div class="tab" data-type="tv">TV Series</div>
            <div class="tab" data-type="movie">Movies</div>
            <div class="tab" data-type="ova">OVAs</div>
            <div class="tab" data-type="special">Specials</div>
        </div>
    </div>

    <div class="grid" id="animeGrid">
        <div class="status-msg">Loading catalog...</div>
    </div>

    <!-- Modal Player -->
    <div class="modal" id="playerModal">
        <div class="modal-content">
            <div class="video-container" id="videoWrapper"></div>
            <div class="modal-body">
                <div class="ep-controls">
                    <label>Episode:</label>
                    <input type="number" id="epNumber" value="1" min="1">
                    <select id="trackType" style="padding: 6px; border-radius: 4px; background: #0f172a; color: #fff; border: 1px solid #334155;">
                        <option value="sub">Sub</option>
                        <option value="dub">Dub</option>
                    </select>
                </div>
                <button class="close-btn" id="closeModal">Close Player</button>
            </div>
        </div>
    </div>

    <script>
        let currentType = '';
        let searchQuery = '';
        let currentAnimeId = null;
        let debounceTimer = null;

        const grid = document.getElementById('animeGrid');
        const searchInput = document.getElementById('searchInput');
        const tabs = document.querySelectorAll('.tab');
        const modal = document.getElementById('playerModal');
        const videoWrapper = document.getElementById('videoWrapper');
        const epInput = document.getElementById('epNumber');
        const trackSelect = document.getElementById('trackType');

        // Fetch Anime with Retry Logic
        async function fetchAnime() {
            grid.innerHTML = '<div class="status-msg">Loading titles...</div>';

            let url = `https://api.jikan.moe/v4/anime?limit=24&sfw=true`;
            if (currentType) url += `&type=${currentType}`;
            if (searchQuery) url += `&q=${encodeURIComponent(searchQuery)}`;
            else url += `&order_by=popularity&sort=asc`;

            try {
                const res = await fetch(url);
                if (res.status === 429) {
                    // Rate limited - wait 1 second and retry
                    setTimeout(fetchAnime, 1200);
                    return;
                }
                const data = await res.json();
                renderCards(data.data || []);
            } catch (err) {
                // Fallback to AniList API if Jikan fails
                fetchAniListFallback();
            }
        }

        // AniList Fallback
        async function fetchAniListFallback() {
            const query = `
            query {
                Page(perPage: 24) {
                    media(type: ANIME, sort: POPULARITY_DESC) {
                        idMal
                        title { english romaji }
                        coverImage { large }
                        format
                    }
                }
            }`;
            try {
                const res = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                const data = await res.json();
                const list = data.data.Page.media.map(item => ({
                    mal_id: item.idMal,
                    title: item.title.english || item.title.romaji,
                    images: { jpg: { image_url: item.coverImage.large } },
                    type: item.format
                }));
                renderCards(list);
            } catch (e) {
                grid.innerHTML = '<div class="status-msg">Error loading content. Please refresh.</div>';
            }
        }

        function renderCards(list) {
            if (!list || list.length === 0) {
                grid.innerHTML = '<div class="status-msg">No anime found.</div>';
                return;
            }

            grid.innerHTML = list.map(item => `
                <div class="card" onclick="openPlayer(${item.mal_id})">
                    <img src="${item.images?.jpg?.image_url || ''}" alt="${item.title}" loading="lazy">
                    <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-sub">${item.type || 'Anime'}</div>
                    </div>
                </div>
            `).join('');
        }

        function openPlayer(id) {
            if (!id) return;
            currentAnimeId = id;
            updateEmbed();
            modal.classList.add('open');
        }

        function updateEmbed() {
            const ep = epInput.value || 1;
            const track = trackSelect.value || 'sub';
            videoWrapper.innerHTML = `
                <iframe src="https://zokoanime.video/stream/mal/${currentAnimeId}/${ep}/${track}" allowfullscreen></iframe>
            `;
        }

        // Event Listeners
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentType = tab.dataset.type;
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(fetchAnime, 400);
            });
        });

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(fetchAnime, 500);
        });

        epInput.addEventListener('change', updateEmbed);
        trackSelect.addEventListener('change', updateEmbed);
        document.getElementById('closeModal').addEventListener('click', () => {
            modal.classList.remove('open');
            videoWrapper.innerHTML = '';
        });

        // Initial Load
        fetchAnime();
    </script>
</body>
</html>
