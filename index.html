<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyUser - Stream Tester</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h2 { margin-bottom: 20px; font-size: 1.5rem; text-align: center; }
        label { display: block; margin-top: 15px; font-size: 0.85rem; color: #94a3b8; }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Stream Tester</h2>
        <form id="streamForm">
            <label for="animeId">Anime ID (MAL/AniList):</label>
            <input type="text" id="animeId" placeholder="e.g. 21" required>

            <label for="episode">Episode:</label>
            <input type="number" id="episode" value="1" min="1" required>

            <label for="providerType">Provider ID Type:</label>
            <select id="providerType">
                <option value="mal">MyAnimeList (MAL)</option>
                <option value="anilist">AniList</option>
            </select>

            <label for="track">Audio Track:</label>
            <select id="track">
                <option value="sub">Sub</option>
                <option value="dub">Dub</option>
                <option value="hsub">HardSub</option>
            </select>

            <button type="submit">Watch Stream</button>
        </form>
    </div>

    <script>
        document.getElementById('streamForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('animeId').value.trim();
            const ep = document.getElementById('episode').value;
            const type = document.getElementById('providerType').value;
            const track = document.getElementById('track').value;

            window.location.href = `watch.html?id=${id}&ep=${ep}&type=${type}&track=${track}`;
        });
    </script>

</body>
</html>
