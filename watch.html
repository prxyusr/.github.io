<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Anime - ProxyUser</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .player-container {
            width: 100%;
            max-width: 1000px;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 ratio */
            background-color: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .info-panel {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-panel h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="video-wrapper" id="player-wrapper"></div>
        <div class="info-panel">
            <h1 id="player-title">Loading Stream...</h1>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const animeId = params.get('id');
        const episode = params.get('ep') || '1';
        const type = params.get('type') || 'mal';
        const track = params.get('track') || 'sub';

        const wrapper = document.getElementById('player-wrapper');
        const title = document.getElementById('player-title');

        if (animeId) {
            const embedUrl = `https://zokoanime.video/stream/${type}/${animeId}/${episode}/${track}`;

            const iframe = document.createElement('iframe');
            iframe.src = embedUrl;
            iframe.allowFullscreen = true;
            iframe.allow = "autoplay; encrypted-media; picture-in-picture";

            wrapper.appendChild(iframe);
            title.textContent = `Episode ${episode} (${track.toUpperCase()})`;
        } else {
            wrapper.style.display = 'none';
            title.innerHTML = '<span style="color: #ef4444;">Error: No Anime ID specified.</span>';
        }
    </script>
</body>
</html>
