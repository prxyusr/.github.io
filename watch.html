<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Anime - ProxyUser</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .player-container {
            width: 100%;
            max-width: 1000px;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 ratio */
            background-color: #000;
        }

        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
        }

        .info-panel {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-panel h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="video-wrapper">
            <video id="videoPlayer" controls crossorigin="anonymous" playsinline></video>
        </div>
        <div class="info-panel">
            <h1 id="player-title">Loading Stream...</h1>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const animeId = params.get('id');
        const episode = params.get('ep') || '1';
        const track = params.get('track') || 'sub';

        const video = document.getElementById('videoPlayer');
        const title = document.getElementById('player-title');

        async function initStandalonePlayer() {
            if (!animeId) {
                title.innerHTML = '<span style="color: #ef4444;">Error: No Anime ID specified.</span>';
                return;
            }

            try {
                const response = await fetch(`/api/stream?id=${animeId}&ep=${episode}&track=${track}`);
                const data = await response.json();

                if (!response.ok || !data.streamUrl) {
                    throw new Error(data.error || 'Unable to fetch stream URL.');
                }

                title.textContent = `Episode ${episode} (${track.toUpperCase()})`;

                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(data.streamUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = data.streamUrl;
                    video.play();
                }

            } catch (err) {
                title.innerHTML = `<span style="color: #ef4444;">Error: ${err.message}</span>`;
            }
        }

        initStandalonePlayer();
    </script>
</body>
</html>
